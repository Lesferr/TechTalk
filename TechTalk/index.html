<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Igloo Dashboard</title>

  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"
  />
</head>

<body>

  <!-- ================= TOPBAR ================= -->
  <header class="topbar">

    <div class="topbar-left">
      <i class="logo fas fa-igloo"></i>
      <h1>Igloo</h1>
    </div>

    <div class="topbar-center">
      <div class="topbar-search">
        <i class="search-icon fas fa-search"></i>
        <input type="text" placeholder="Search..." />
      </div>
    </div>

    <div class="topbar-right">

      <!-- STATE-AWARE TOGGLE -->
      <button
        class="line-container"
        id="menuToggle"
        aria-label="Navigation menu"
        aria-expanded="false"
        data-state="closed"
      >
        <span class="line line-1"></span>
        <span class="line line-2"></span>
        <span class="line line-3"></span>
      </button>

    </div>
  </header>

  <!-- ================= OVERLAY (NEW) ================= -->
  <div class="overlay" id="overlay"></div>

  <!-- ================= SIDEBAR ================= -->
  <nav
    class="menu"
    id="sidebar"
    aria-hidden="true"
    data-state="closed"
  >

    <div class="menu-top">
      <div class="menu-search">
        <i class="search-icon fas fa-search"></i>
        <input type="text" placeholder="Search" />
      </div>
    </div>

    <div class="menu-center">

      <a class="menu-item" href="#">
        <i class="fas fa-home"></i><span>Home</span>
      </a>

      <a class="menu-item" href="#">
        <i class="fas fa-paper-plane"></i><span>Pages</span>
      </a>

      <a class="menu-item" href="#">
        <i class="fas fa-user-friends"></i><span>Groups</span>
      </a>

      <a class="menu-item" href="#">
        <i class="fas fa-users"></i><span>People</span>
      </a>

      <a class="menu-item" href="#">
        <i class="fas fa-bullhorn"></i><span>Updates</span>
      </a>

    </div>

    <div class="menu-bottom">
      <div class="menu-bottom-user">
        <img
          src="https://images.pexels.com/photos/5944321/pexels-photo-5944321.jpeg"
          alt="User"
        />
        <span>John Doe</span>
      </div>

      <i class="far fa-question-circle"></i>
    </div>

  </nav>

  <script src="app.js"></script>
</body>
</html>
